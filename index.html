<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fluxora — read, search and annotate PDFs without uploading them." />
    <title>Fluxora</title>
    <script>
      // Apply the saved theme before first paint so a light-mode user never sees a dark flash.
      try {
        var saved = JSON.parse(localStorage.getItem('fluxora:settings') || '{}')
        var theme = saved && saved.state && saved.state.theme
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
      } catch (error) {
        /* Corrupt settings should never block the app from booting. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
